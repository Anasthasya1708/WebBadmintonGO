<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Login - BadmintonGO</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Styling Toast / Snackbar */
        #toast {
            visibility: hidden;
            min-width: 250px;
            background-color: #333;
            color: #fff;
            text-align: center;
            border-radius: 4px;
            padding: 16px;
            position: fixed;
            z-index: 1000;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            font-size: 14px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.2);
        }
        #toast.show {
            visibility: visible;
            animation: fadein 0.5s, fadeout 0.5s 2.5s;
        }
        @keyframes fadein {
            from { bottom: 0; opacity: 0; }
            to { bottom: 30px; opacity: 1; }
        }
        @keyframes fadeout {
            from { bottom: 30px; opacity: 1; }
            to { bottom: 0; opacity: 0; }
        }
    </style>
</head>
<body>
<main class="auth">
    <div class="auth-box">
        <div class="auth-image">
            <strong>BadmintonGO</strong>
            <h1>Selamat datang!</h1>
            <p>Masuk untuk mengakses dashboard BadmintonGO.</p>
        </div>
        <div class="form">
            <div class="brand">BadmintonGO</div>
            <h2>Login</h2>
            <p>Masukkan data akun kamu.</p>
            <form id="loginForm">
                <div class="field"><label>Email</label><input type="email" id="email" placeholder="Email" required></div>
                <div class="field"><label>Username</label><input type="text" id="username" placeholder="Username" required></div>
                <div class="field"><label>Password</label><input type="password" id="password" placeholder="Password" required></div>
                <button type="submit" class="submit">LOGIN</button>
            </form>
            <p class="switch">Belum punya akun? <a href="register.html">Register</a></p>
            <p class="switch"><a href="index.html">← Kembali</a></p>
        </div>
    </div>
</main>

<!-- Elemen Toast Notification -->
<div id="toast">Login Berhasil! Mengalihkan...</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault(); // Mencegah reload form bawaan HTML
        
        // Tampilkan Toast
        const toast = document.getElementById('toast');
        toast.className = "show";
        
        // Simulasi pindah halaman setelah toast selesai (3 detik)
        setTimeout(function() {
            toast.className = toast.className.replace("show", "");
            window.location.href = "index.html";
        }, 3000);
    });
</script>
</body>
</html>
